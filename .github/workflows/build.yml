name: Build Tech Capsules

on:
  push:
    branches:
      - main

jobs:
  build:

    runs-on: ubuntu-latest

    steps:

      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install System Dependencies for WeasyPrint
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libcairo2 \
            libpango-1.0-0 \
            libpangocairo-1.0-0 \
            libgdk-pixbuf-2.0-0 \
            libffi-dev \
            shared-mime-info

      - name: Install Python Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run Tests with Coverage
        run: |
          pytest --cov=src --cov-report=term-missing

      - name: Build Project
        run: |
          PYTHONPATH=src python -m tech_capsules.build

      - name: Show Output
        run: |
          ls -R output || true
          ls -R docs || true

      - name: Upload Output
        uses: actions/upload-artifact@v4
        with:
          name: tech-capsules
          path: |
            output
            docs
 
